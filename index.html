<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shehryar Khan | Shehrology</title>
<meta name="description" content="Official digital profile of Shehryar Khan">
<meta name="theme-color" content="#f4f2ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e12" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Social media icons (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#f4f2ed; --card:#fffefb; --ink:#17161c; --muted:#6f6c76; --hover:#efede7;
  --line:rgba(23,22,28,.12); --accent:#4b3df2;
  --shadow:0 1px 2px rgba(23,22,28,.04),0 14px 40px -12px rgba(23,22,28,.14);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e0e12; --card:#17171d; --ink:#ece9e4; --muted:#9a97a2; --hover:#1f1f27;
        --line:rgba(255,255,255,.12); --accent:#a094ff;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px -12px rgba(0,0,0,.6);
        color-scheme:dark}
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(640px 420px at 18% -4%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 72%),
    var(--bg);
}
.container{max-width:560px;margin:0 auto;padding:22px 22px 44px}

.top{display:flex;justify-content:flex-end}
.share{
  width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);
  font-size:16px;cursor:pointer;transition:background .2s,transform .2s
}
.share:hover{background:var(--card);transform:translateY(-2px)}

.layout{animation:rise .7s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.profile{text-align:center;padding-top:10px}
.avatar-wrap{
  width:148px;height:148px;border-radius:50%;margin:0 auto 26px;padding:6px;
  border:1px solid var(--accent);
}
.avatar{
  width:100%;height:100%;border-radius:50%;background:#a9aaa4;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;overflow:hidden;
  box-shadow:var(--shadow);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.name{
  font-family:var(--serif);font-weight:400;font-size:clamp(44px,9vw,60px);
  line-height:1.04;letter-spacing:-.01em;margin-bottom:10px
}
.username{font-size:15px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin-bottom:28px}

.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
.socials a{
  --b:var(--ink);--on:var(--bg);
  width:48px;height:48px;border-radius:50%;background:transparent;color:var(--ink);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;text-decoration:none;
  transition:background .2s,color .2s,border-color .2s,transform .2s
}
.socials a:hover{background:var(--b);border-color:var(--b);color:var(--on);transform:translateY(-3px)}
.socials .ig{--b:#e1306c;--on:#fff}.socials .fb{--b:#1877f2;--on:#fff}
.socials .wa{--b:#25d366;--on:#fff}.socials .sc{--b:#fffc00;--on:#111}

.note{
  font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.45;
  color:var(--muted);max-width:30ch;margin:34px auto 36px;text-wrap:balance
}

.pdf{
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:14px
}
.pdf iframe{display:block;width:100%;aspect-ratio:4/5;min-height:380px;border:0;background:#fff}

.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:11px 18px 11px 11px;min-height:62px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none;
  font-size:15.5px;font-weight:700;transition:background .2s,transform .2s
}
.link:hover{background:var(--hover);transform:translateY(-2px)}
.chip{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)
}
.link .t{flex:1}
.link .go{font-size:12px;color:var(--muted);transition:transform .2s}
.link:hover .go{transform:translateX(4px)}

a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.02em;margin-top:56px;line-height:1.9}

/* Tablet */
@media (min-width:600px){
  .container{max-width:700px;padding:28px 32px 56px}
  .avatar-wrap{width:160px;height:160px}
  .pdf iframe{aspect-ratio:5/6}
}

/* Desktop: identity on the left, document on the right */
@media (min-width:960px){
  .container{max-width:1080px;padding:36px 48px 64px}
  .layout{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:88px;align-items:start;padding-top:20px}
  .profile{position:sticky;top:48px;text-align:left;padding-top:0}
  .avatar-wrap{margin:0 0 30px}
  .socials{justify-content:flex-start}
  .note{margin:34px 0 0;max-width:26ch;text-wrap:pretty}
  .pdf iframe{aspect-ratio:auto;height:min(78vh,780px)}
  .footer{margin-top:72px}
}

@media (max-width:400px){.container{padding:18px 16px 36px}.socials{gap:10px}.note{font-size:20px}}
@media (prefers-reduced-motion:reduce){.layout{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div class="container">

  <div class="top">
    <button class="share" onclick="sharePage()" aria-label="Share page"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
  </div>

  <div class="layout">

  <header class="profile">
    <div class="avatar-wrap">
      <div class="avatar">
     <img src="photo.jpg" alt="Shehryar Khan">
      </div>
    </div>

    <h1 class="name">Shehryar Khan</h1>
    <p class="username">@Shehrology</p>

    <nav class="socials" aria-label="Social media">
      <a class="ig" href="https://www.instagram.com/shehrology/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a class="fb" href="https://www.facebook.com/shehrology/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://x.com/shehrology/" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a class="wa" href="https://wa.me/923085000355" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      <!-- Apna Snapchat username YOUR_SNAPCHAT ki jagah likho -->
      <a class="sc" href="https://www.snapchat.com/add/Shehrology" target="_blank" rel="noopener" aria-label="Snapchat"><i class="fa-brands fa-snapchat"></i></a>
    </nav>

    <p class="note">This family tree was compiled by Shehryar Khan, son of Lal Bahadur, in November 2026.</p>
  </header>

  <main>
    <!-- PDF preview.
         Apna Google Drive file ka link ye hota hai:
         https://drive.google.com/file/d/FILE_ID/view
         Neeche dono jagah FILE_ID badal do (preview mein "/preview" lagta hai).
         Drive mein file ko "Anyone with the link" share karna zaroori hai. -->
    <div class="pdf">
      <iframe src="https://drive.google.com/file/d/19kEy357zMCG-SEWmpBjn-_P0HYXMRCCV/preview"
              title="PDF preview" loading="lazy" allow="autoplay"></iframe>
    </div>

    <div class="links">
      <a class="link" style="--c:#1fa463" href="https://drive.google.com/file/d/19kEy357zMCG-SEWmpBjn-_P0HYXMRCCV/view?usp=drive_link" target="_blank" rel="noopener">
        <span class="chip"><i class="fa-brands fa-google-drive"></i></span>
        <span class="t">Google Drive</span>
        <i class="fa-solid fa-chevron-right go"></i>
      </a>
    </div>
  </main>

  </div>

  <footer class="footer">© 2026 Shehryar Khan<br>All Rights Reserved.</footer>
</div>

<script>
function sharePage(){
  var url = window.location.href;
  if (navigator.share) {
    navigator.share({title:'Shehryar Khan', text:'Visit my personal profile', url:url}).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function(){alert('Link copied!')}).catch(function(){alert('Please copy the link manually.')});
  } else {
    alert('Please copy the link manually.');
  }
}
</script>
</body>
</html>
