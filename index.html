<style>
:root{
  --bg:#eceef3; --card:#ffffff; --ink:#14161c; --muted:#6b7080;
  --hover:#f6f7fb; --ring-a:#6d5efc; --ring-b:#22c1c3; --shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1117; --card:#1a1d27; --ink:#f2f3f7; --muted:#9097aa; --hover:#222636; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--ink); min-height:100vh; min-height:100dvh; position:relative; overflow-x:hidden;
  background:
    radial-gradient(520px 320px at 85% -5%,rgba(109,94,252,.18),transparent 70%),
    radial-gradient(480px 300px at 5% 30%,rgba(34,193,195,.14),transparent 70%),
    var(--bg);
}
.container{max-width:520px;margin:0 auto;padding:22px 20px 40px}
.top{display:flex;justify-content:flex-end}
.icon-btn{
  width:44px;height:44px;border:none;border-radius:50%;background:var(--card);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s
}
.icon-btn:hover{transform:scale(1.07)}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.icon-btn svg{font-size:20px}

.profile{text-align:center;padding-top:22px}
.avatar-wrap{
  width:118px;height:118px;border-radius:50%;margin:0 auto 18px;padding:4px;
  background:conic-gradient(from 0deg,var(--ring-a),var(--ring-b),var(--ring-a));
  animation:spin 9s linear infinite;
}
.avatar{
  width:100%;height:100%;border-radius:50%;background:#a9aaa4;border:4px solid var(--bg);
  display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;overflow:hidden;
  animation:spin 9s linear infinite reverse;
}
.avatar img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.name{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.username{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px}
.tagline{font-size:14px;color:var(--muted);margin-bottom:24px}

.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.socials a{
  width:48px;height:48px;border-radius:50%;background:var(--card);color:var(--ink);
  display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s,color .2s
}
.socials a svg{font-size:23px}
.socials a:hover{transform:translateY(-4px)}
.socials a.ig:hover{color:#e1306c}.socials a.fb:hover{color:#1877f2}
.socials a.wa:hover{color:#25d366}.socials a.sc:hover{color:#f5c400}

.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;min-height:60px;
  background:var(--card);border-radius:16px;color:var(--ink);text-decoration:none;
  font-size:15.5px;font-weight:700;box-shadow:var(--shadow);transition:transform .2s,background .2s
}
.link:hover{background:var(--hover);transform:translateY(-2px)}
.chip{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  font-size:19px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)
}
.link span.t{flex:1}
.link .go{font-size:16px;color:var(--muted)}

a:focus-visible,button:focus-visible{outline:3px solid var(--ring-a);outline-offset:3px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;line-height:1.8}

@media (max-width:400px){.container{padding:18px 16px 32px}.name{font-size:24px}.socials{gap:11px}}
@media (prefers-reduced-motion:reduce){.avatar-wrap,.avatar{animation:none}*{transition:none!important}}
</style>
</head>
