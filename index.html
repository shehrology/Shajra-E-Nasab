<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shehryar Khan | Shehrology</title>
<meta name="description" content="Official digital profile of Shehryar Khan">
<meta name="theme-color" content="#eceef3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Social media icons (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#eceef3; --card:#ffffff; --ink:#14161c; --muted:#6b7080; --hover:#f6f7fb;
  --ring-a:#6d5efc; --ring-b:#22c1c3;
  --shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px rgba(20,22,28,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1117; --card:#1a1d27; --ink:#f2f3f7; --muted:#9097aa; --hover:#222636;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden;
  background:
    radial-gradient(520px 320px at 85% -5%,rgba(109,94,252,.18),transparent 70%),
    radial-gradient(480px 300px at 5% 30%,rgba(34,193,195,.14),transparent 70%),
    var(--bg);
}
.container{max-width:520px;margin:0 auto;padding:22px 20px 40px}

.top{display:flex;justify-content:flex-end}
.share{
  width:44px;height:44px;border:none;border-radius:50%;background:var(--card);color:var(--ink);
  font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s
}
.share:hover{transform:scale(1.07)}

.profile{text-align:center;padding-top:22px}
.avatar-wrap{
  width:118px;height:118px;border-radius:50%;margin:0 auto 18px;padding:4px;
  background:conic-gradient(from 0deg,var(--ring-a),var(--ring-b),var(--ring-a));
  animation:spin 9s linear infinite;
}
.avatar{
  width:100%;height:100%;border-radius:50%;background:#a9aaa4;border:4px solid var(--bg);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;overflow:hidden;
  animation:spin 9s linear infinite reverse;
}
.avatar img{width:100%;height:100%;object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.name{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.username{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:24px}

.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-bottom:34px}
.socials a{
  width:48px;height:48px;border-radius:50%;background:var(--card);color:var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none;
  box-shadow:var(--shadow);transition:transform .2s,color .2s
}
.socials a:hover{transform:translateY(-4px)}
.socials .ig:hover{color:#e1306c}.socials .fb:hover{color:#1877f2}
.socials .wa:hover{color:#25d366}.socials .sc:hover{color:#f5c400}

.pdf{
  background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px
}
.pdf iframe{display:block;width:100%;height:300px;border:0;background:#fff}

.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;min-height:60px;
  background:var(--card);border-radius:16px;color:var(--ink);text-decoration:none;
  font-size:15.5px;font-weight:700;box-shadow:var(--shadow);transition:transform .2s,background .2s
}
.link:hover{background:var(--hover);transform:translateY(-2px)}
.chip{
  width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;
  font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)
}
.link .t{flex:1}
.link .go{font-size:13px;color:var(--muted)}

a:focus-visible,button:focus-visible{outline:3px solid var(--ring-a);outline-offset:3px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;line-height:1.8}

@media (max-width:400px){.container{padding:18px 16px 32px}.name{font-size:24px}.socials{gap:11px}.pdf iframe{height:260px}}
@media (prefers-reduced-motion:reduce){.avatar-wrap,.avatar{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div class="container">

  <div class="top">
    <button class="share" onclick="sharePage()" aria-label="Share page"><i class="fa-solid fa-arrow-up-from-bracket"></i></button>
  </div>

  <header class="profile">
    <div class="avatar-wrap">
      <div class="avatar">
        SK
        <!-- Photo lagani ho to "SK" hata kar ye line use karo:
        <img src="YOUR-PHOTO-URL" alt="Shehryar Khan"> -->
      </div>
    </div>

    <h1 class="name">Shehryar Khan</h1>
    <p class="username">@Shehrology</p>

    <nav class="socials" aria-label="Social media">
      <a class="ig" href="https://www.instagram.com/shehrology/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
      <a class="fb" href="https://www.facebook.com/shehrology/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="https://x.com/shehrology/" target="_blank" rel="noopener" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      <a class="wa" href="https://wa.me/923085000355" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
      <!-- Apna Snapchat username YOUR_SNAPCHAT ki jagah likho -->
      <a class="sc" href="https://www.snapchat.com/add/YOUR_SNAPCHAT" target="_blank" rel="noopener" aria-label="Snapchat"><i class="fa-brands fa-snapchat"></i></a>
      <a href="tel:+923085000355" aria-label="Call"><i class="fa-solid fa-phone"></i></a>
    </nav>
  </header>

  <main>
    <!-- PDF preview.
         Apna Google Drive file ka link ye hota hai:
         https://drive.google.com/file/d/FILE_ID/view
         Neeche dono jagah FILE_ID badal do (preview mein "/preview" lagta hai).
         Drive mein file ko "Anyone with the link" share karna zaroori hai. -->
    <div class="pdf">
      <iframe src="https://drive.google.com/file/d/19kEy357zMCG-SEWmpBjn-_P0HYXMRCCV/preview"
              title="PDF preview" loading="lazy" allow="autoplay"></iframe>
    </div>

    <div class="links">
      <a class="link" style="--c:#1fa463" href="https://drive.google.com/file/d/19kEy357zMCG-SEWmpBjn-_P0HYXMRCCV/view?usp=drive_link" target="_blank" rel="noopener">
        <span class="chip"><i class="fa-brands fa-google-drive"></i></span>
        <span class="t">Google Drive</span>
        <i class="fa-solid fa-chevron-right go"></i>
      </a>

      </a>
    </div>
  </main>

  <footer class="footer">© 2026 Shehryar Khan<br>All Rights Reserved.</footer>
</div>

<script>
function sharePage(){
  var url = window.location.href;
  if (navigator.share) {
    navigator.share({title:'Shehryar Khan', text:'Visit my personal profile', url:url}).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function(){alert('Link copied!')}).catch(function(){alert('Please copy the link manually.')});
  } else {
    alert('Please copy the link manually.');
  }
}
</script>
</body>
</html>
